<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Deep Twilight Sky Gradient -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="25%" stop-color="#0A1E3D"/>
      <stop offset="55%" stop-color="#143464"/>
      <stop offset="78%" stop-color="#1E4D8C"/>
      <stop offset="92%" stop-color="#D97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Mountain Silhouette Gradient -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2442" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A3B66" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0D2744"/>
    </linearGradient>

    <!-- Real School Roof Gradient (Terracotta Clay Tile) -->
    <linearGradient id="clayRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="20%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="80%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <!-- School Wall Real Gradient (Clean Modern White & Sage Green Accent) -->
    <linearGradient id="wallWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="wallSage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Modern Tinted Glass Windows with Interior Warm Light -->
    <linearGradient id="warmWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="cyanWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Paved Courtyard Real Surface with Wet/Evening Reflection -->
    <linearGradient id="pavedGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="35%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Digital Cyber Glow Radial Filter -->
    <radialGradient id="cyberGlowCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. TWILIGHT SKY -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#twilightSky)"/>

  <!-- Stars & Cyber Particle Constellation -->
  <g fill="#BAE6FD" opacity="0.65">
    <circle cx="80" cy="60" r="1.5"/>
    <circle cx="140" cy="90" r="1.2"/>
    <circle cx="210" cy="45" r="1.8"/>
    <circle cx="320" cy="70" r="1.5"/>
    <circle cx="450" cy="50" r="1.2"/>
    <circle cx="580" cy="35" r="2.0"/>
    <circle cx="700" cy="60" r="1.4"/>
    <circle cx="820" cy="40" r="1.8"/>
    <circle cx="950" cy="65" r="1.2"/>
    <circle cx="1060" cy="45" r="1.6"/>
    <circle cx="1180" cy="75" r="1.5"/>
    <circle cx="1230" cy="30" r="2.2"/>
  </g>

  <!-- Distant Scenic Garut Mountain Silhouettes -->
  <path d="M-50,420 Q280,240 580,380 T1100,340 Q1220,290 1330,400 L1330,500 L-50,500 Z" fill="url(#mountainFar)"/>
  <path d="M-50,450 Q360,310 720,420 T1330,410 L1330,520 L-50,520 Z" fill="url(#mountainMid)"/>

  <!-- Glowing Sunset Horizon Line -->
  <rect x="0" y="440" width="1280" height="6" fill="#F59E0B" opacity="0.4"/>

  <!-- Lush Tropical Trees Surrounding Campus -->
  <g opacity="0.95">
    <circle cx="90" cy="410" r="85" fill="#064E3B"/>
    <circle cx="180" cy="390" r="95" fill="#065F46"/>
    <circle cx="270" cy="415" r="80" fill="#047857"/>
    
    <circle cx="1010" cy="415" r="80" fill="#047857"/>
    <circle cx="1100" cy="390" r="95" fill="#065F46"/>
    <circle cx="1190" cy="410" r="85" fill="#064E3B"/>
  </g>

  <!-- 2. HIGH-RES MODERN SDN 4 PUTRAJAWA SCHOOL ARCHITECTURE -->
  <g id="sdn4Building">
    <!-- Center Main Multi-Story Classrooms Building -->
    <!-- Rear Shadow -->
    <rect x="340" y="320" width="600" height="150" fill="#0B132B"/>

    <!-- Left Wing Building (Perspektif Realistik Kelas) -->
    <polygon points="120,360 380,350 380,470 120,480" fill="url(#wallWhite)"/>
    <polygon points="100,330 380,320 380,350 100,360" fill="url(#clayRoofGrad)"/>
    <polygon points="120,430 380,420 380,470 120,480" fill="url(#wallSage)"/>
    <!-- Left Wing Windows (Glowing Interior Warm Study Light) -->
    <rect x="150" y="375" width="45" height="38" fill="url(#warmWindow)" rx="3" stroke="#0F172A" stroke-width="2"/>
    <rect x="220" y="372" width="45" height="38" fill="url(#cyanWindow)" rx="3" stroke="#0F172A" stroke-width="2"/>
    <rect x="290" y="369" width="45" height="38" fill="url(#warmWindow)" rx="3" stroke="#0F172A" stroke-width="2"/>

    <!-- Right Wing Building (Perspektif Realistik Lab & Ruang Guru) -->
    <polygon points="900,350 1160,360 1160,480 900,470" fill="url(#wallWhite)"/>
    <polygon points="900,320 1180,330 1180,360 900,350" fill="url(#clayRoofGrad)"/>
    <polygon points="900,420 1160,430 1160,480 900,470" fill="url(#wallSage)"/>
    <!-- Right Wing Windows -->
    <rect x="945" y="369" width="45" height="38" fill="url(#warmWindow)" rx="3" stroke="#0F172A" stroke-width="2"/>
    <rect x="1015" y="372" width="45" height="38" fill="url(#cyanWindow)" rx="3" stroke="#0F172A" stroke-width="2"/>
    <rect x="1085" y="375" width="45" height="38" fill="url(#warmWindow)" rx="3" stroke="#0F172A" stroke-width="2"/>

    <!-- Central Grand Academic Pavilion -->
    <rect x="360" y="300" width="560" height="170" fill="url(#wallWhite)"/>
    <!-- Main Terracotta Hip Roof (Atap Limasan Khas Jawa Barat) -->
    <polygon points="330,300 640,195 950,300" fill="url(#clayRoofGrad)"/>
    <line x1="330" y1="300" x2="950" y2="300" stroke="#7C2D12" stroke-width="6"/>
    <line x1="640" y1="195" x2="640" y2="215" stroke="#F59E0B" stroke-width="4"/>

    <!-- Academic Center Pillars (Selasar Kelas) -->
    <rect x="390" y="300" width="16" height="170" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="490" y="300" width="16" height="170" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="590" y="300" width="16" height="170" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="674" y="300" width="16" height="170" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="774" y="300" width="16" height="170" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="874" y="300" width="16" height="170" fill="#F1F5F9" stroke="#94A3B8"/>

    <!-- Center Windows & Glass Doors -->
    <rect x="420" y="330" width="55" height="60" fill="url(#cyanWindow)" rx="4" stroke="#0F172A" stroke-width="2"/>
    <rect x="520" y="330" width="55" height="60" fill="url(#warmWindow)" rx="4" stroke="#0F172A" stroke-width="2"/>
    <rect x="705" y="330" width="55" height="60" fill="url(#warmWindow)" rx="4" stroke="#0F172A" stroke-width="2"/>
    <rect x="805" y="330" width="55" height="60" fill="url(#cyanWindow)" rx="4" stroke="#0F172A" stroke-width="2"/>
    
    <!-- Grand Entrance Lobby -->
    <rect x="615" y="340" width="50" height="130" fill="#0F172A" rx="4"/>
    <rect x="620" y="345" width="40" height="125" fill="#38BDF8" opacity="0.6"/>

    <!-- Official School Signboard: SDN 4 PUTRAJAWA -->
    <rect x="470" y="275" width="340" height="42" fill="#047857" rx="8" stroke="#FBBF24" stroke-width="3"/>
    <rect x="474" y="279" width="332" height="34" fill="none" rx="6" stroke="#FEF08A" stroke-width="1"/>
    <text x="640" y="303" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      SDN 4 PUTRAJAWA
    </text>
  </g>

  <!-- 3. INDONESIAN FLAG POLE (Tiang Bendera Merah Putih Berkibar) -->
  <g id="indonesianFlag">
    <ellipse cx="640" cy="485" rx="35" ry="10" fill="#334155"/>
    <line x1="640" y1="485" x2="640" y2="180" stroke="#E2E8F0" stroke-width="4"/>
    <line x1="641" y1="485" x2="641" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="640" cy="178" r="5" fill="#FBBF24"/>
    <!-- Fluttering Red & White Flag -->
    <path d="M642,182 Q685,170 725,185 T790,178 L790,212 Q750,218 725,204 T642,212 Z" fill="#DC2626"/>
    <path d="M642,212 Q685,204 725,218 T790,212 L790,242 Q750,248 725,234 T642,242 Z" fill="#FFFFFF"/>
  </g>

  <!-- 4. MODERN PAVED COURTYARD & DIGITAL CYBER REFLECTIONS -->
  <polygon points="0,470 1280,470 1280,720 0,720" fill="url(#pavedGround)"/>
  <!-- Polished ground grid lines -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.25">
    <line x1="0" y1="500" x2="1280" y2="500"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="0" y1="590" x2="1280" y2="590"/>
    <line x1="0" y1="650" x2="1280" y2="650"/>

    <line x1="640" y1="470" x2="0" y2="720"/>
    <line x1="640" y1="470" x2="280" y2="720"/>
    <line x1="640" y1="470" x2="520" y2="720"/>
    <line x1="640" y1="470" x2="760" y2="720"/>
    <line x1="640" y1="470" x2="1000" y2="720"/>
    <line x1="640" y1="470" x2="1280" y2="720"/>
  </g>

  <!-- Light Reflection Glows on Ground from Windows -->
  <ellipse cx="640" cy="510" rx="280" ry="25" fill="#38BDF8" opacity="0.15"/>
  <ellipse cx="230" cy="505" rx="120" ry="18" fill="#FDE047" opacity="0.12"/>
  <ellipse cx="1040" cy="505" rx="120" ry="18" fill="#FDE047" opacity="0.12"/>

  <!-- 5. FUTURISTIC DIGITAL ONLINE COMMUNITY CONNECTIVITY -->
  <!-- Floating Cyber Nodes & Data Streams Connecting SDN 4 to the Web -->
  <g opacity="0.85">
    <!-- Network Fiber Lines -->
    <path d="M180,360 Q380,220 640,195 T1100,350" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6,4"/>
    <path d="M260,280 Q640,140 1020,280" fill="none" stroke="#34D399" stroke-width="1.4" stroke-dasharray="4,4"/>

    <!-- Glowing Interactive Nodes -->
    <circle cx="180" cy="360" r="5" fill="#38BDF8"/>
    <circle cx="180" cy="360" r="10" fill="#38BDF8" opacity="0.3"/>
    
    <circle cx="380" cy="250" r="4" fill="#FDE047"/>
    <circle cx="380" cy="250" r="8" fill="#FDE047" opacity="0.3"/>

    <circle cx="640" cy="160" r="6" fill="#34D399"/>
    <circle cx="640" cy="160" r="14" fill="#34D399" opacity="0.25"/>

    <circle cx="900" cy="250" r="4" fill="#38BDF8"/>
    <circle cx="900" cy="250" r="8" fill="#38BDF8" opacity="0.3"/>

    <circle cx="1100" cy="350" r="5" fill="#38BDF8"/>
    <circle cx="1100" cy="350" r="10" fill="#38BDF8" opacity="0.3"/>
  </g>

  <!-- Ambient Cinematic Depth Vignette -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#cyberGlowCenter)"/>
</svg>