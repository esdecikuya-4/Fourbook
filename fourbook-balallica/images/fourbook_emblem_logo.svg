<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <!-- Outer Gold Gradient -->
    <linearGradient id="goldRimGrad" x1="21" y1="21" x2="87" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <!-- Deep Navy Track Gradient -->
    <linearGradient id="navyTrackGrad" x1="24" y1="24" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <!-- Center Royal Blue Gradient -->
    <linearGradient id="centerDiscGrad" x1="32" y1="32" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="40%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadow -->
  <circle cx="54" cy="56" r="34" fill="rgba(0,0,0,0.3)"/>

  <!-- 2. Outer Beveled Gold Ring -->
  <circle cx="54" cy="54" r="33" fill="url(#goldRimGrad)"/>
  <circle cx="54" cy="54" r="32" fill="none" stroke="#FEF9C3" stroke-width="1"/>

  <!-- 3. Decorative Gold Studs -->
  <circle cx="54" cy="23" r="1.2" fill="#FEF9C3"/>
  <circle cx="70" cy="27" r="1.2" fill="#FEF9C3"/>
  <circle cx="81" cy="38" r="1.2" fill="#FEF9C3"/>
  <circle cx="85" cy="54" r="1.2" fill="#FEF9C3"/>
  <circle cx="81" cy="70" r="1.2" fill="#FEF9C3"/>
  <circle cx="70" cy="81" r="1.2" fill="#FEF9C3"/>
  <circle cx="54" cy="85" r="1.2" fill="#FEF9C3"/>
  <circle cx="38" cy="81" r="1.2" fill="#FEF9C3"/>
  <circle cx="27" cy="70" r="1.2" fill="#FEF9C3"/>
  <circle cx="23" cy="54" r="1.2" fill="#FEF9C3"/>
  <circle cx="27" cy="38" r="1.2" fill="#FEF9C3"/>
  <circle cx="38" cy="27" r="1.2" fill="#FEF9C3"/>

  <!-- 4. Deep Navy Blue Circular Band -->
  <circle cx="54" cy="54" r="29.5" fill="url(#navyTrackGrad)"/>
  <circle cx="54" cy="54" r="22.5" fill="none" stroke="#F59E0B" stroke-width="1.8"/>

  <!-- 5. Core Royal Blue Center Disc -->
  <circle cx="54" cy="54" r="21.5" fill="url(#centerDiscGrad)"/>

  <!-- Sunburst Light Rays -->
  <g stroke="#93C5FD" stroke-width="0.8" opacity="0.45">
    <line x1="54" y1="34" x2="54" y2="37"/>
    <line x1="68" y1="40" x2="65.5" y2="42"/>
    <line x1="74" y1="54" x2="71" y2="54"/>
    <line x1="68" y1="68" x2="65.5" y2="66"/>
    <line x1="54" y1="74" x2="54" y2="71"/>
    <line x1="40" y1="68" x2="42.5" y2="66"/>
    <line x1="34" y1="54" x2="37" y2="54"/>
    <line x1="40" y1="40" x2="42.5" y2="42"/>
  </g>

  <!-- 6. Golden Graduation Toga Cap -->
  <polygon points="54,30 63,33.5 54,37 45,33.5" fill="#FEF08A" stroke="#B45309" stroke-width="0.6"/>
  <path d="M49,35.5 Q54,38.5 59,35.5 L59,37 Q54,40 49,37 Z" fill="#F59E0B"/>
  <line x1="54" y1="33.5" x2="46" y2="36.5" stroke="#FEF08A" stroke-width="0.8"/>
  <circle cx="46" cy="36.5" r="1" fill="#FEF08A"/>

  <!-- 7. Golden Laurel Wreath -->
  <path d="M36,46 C34,44 34,48 37,49 Z" fill="#FBBF24"/>
  <path d="M35,53 C33,52 33,55 36,56 Z" fill="#FBBF24"/>
  <path d="M36,60 C34,60 35,63 38,63 Z" fill="#FBBF24"/>
  <path d="M72,46 C74,44 74,48 71,49 Z" fill="#FBBF24"/>
  <path d="M73,53 C75,52 75,55 72,56 Z" fill="#FBBF24"/>
  <path d="M72,60 C74,60 73,63 70,63 Z" fill="#FBBF24"/>

  <!-- 8. PROMINENT 3D LETTER "F" (Fourbook) -->
  <path d="M46,42.5 L65,42.5 L65,48.5 L53,48.5 L53,52.5 L62,52.5 L62,57.5 L53,57.5 L53,68.5 L46,68.5 Z" fill="#451A03"/>
  <path d="M45,41 L64,41 C64.5,41 65,41.5 65,42 L65,47 C65,47.5 64.5,48 64,48 L52.5,48 L52.5,52 L61,52 C61.5,52 62,52.5 62,53 L62,57 C62,57.5 61.5,58 61,58 L52.5,58 L52.5,67 C52.5,67.5 52,68 51.5,68 L46,68 C45.5,68 45,67.5 45,67 Z" fill="#FFFFFF"/>
  <path d="M45.5,41.5 L63.5,41.5 M45.5,52.5 L60.5,52.5" stroke="#FEF08A" stroke-width="1" stroke-linecap="round"/>

  <!-- 9. Three Golden Stars at Bottom -->
  <polygon points="54,70 54.7,71.5 56.3,71.7 55.1,72.9 55.4,74.5 54,73.7 52.6,74.5 52.9,72.9 51.7,71.7 53.3,71.5" fill="#FEF08A"/>
  <polygon points="47,69.5 47.5,70.7 48.8,70.9 47.8,71.9 48.1,73.1 47,72.5 45.9,73.1 46.2,71.9 45.2,70.9 46.5,70.7" fill="#FBBF24"/>
  <polygon points="61,69.5 61.5,70.7 62.8,70.9 61.8,71.9 62.1,73.1 61,72.5 59.9,73.1 60.2,71.9 59.2,70.9 60.5,70.7" fill="#FBBF24"/>
</svg>
